site_name: AIForged Documentation
site_url: https://docs.aiforged.com
site_description: Official AIForged documentation for Studio, platform services, agents, documents, assistants, workflows, SDKs, and automation.

theme:
  name: material
  custom_dir: overrides
  logo: assets/logo.png        # make sure this file exists
  favicon: assets/favicon.ico  # optional
  features:
    - navigation.sections
    - navigation.indexes
    - search.suggest
    - search.highlight
    - content.code.copy
  palette:
    - scheme: slate
      primary: custom
      accent: custom
    - scheme: default
      primary: custom
      accent: custom

extra:
  social_preview_image: assets/social/aiforged-logo-banner.png
  social_preview_image_alt: AIForged Documentation

extra_css:
  - assets/theme.css

plugins:
  - search
  - mermaid2
  
markdown_extensions:
  - meta
  - admonition
  - toc:
      permalink: true
  - footnotes
  - def_list
  - attr_list
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:mermaid2.fence_mermaid_custom
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.highlight

